{% extends "base.html" %}

{% block title %}Reset Password — RNews{% endblock %}

{% block content %}
<div class="auth-page">
  <h2>Choose a new password</h2>
  {% if error %}
    <div class="form-error">{{ error }}</div>
  {% endif %}
  {% if token %}
  <form action="/reset-password/{{ token }}" method="post" class="auth-form">
    <label>New password
      <input type="password" name="password" required minlength="6" autofocus/>
    </label>
    <label>Confirm password
      <input type="password" name="password2" required minlength="6"/>
    </label>
    <button type="submit">Set new password</button>
  </form>
  {% else %}
  <p><a href="/forgot-password">Request a new reset link</a></p>
  {% endif %}
</div>
{% endblock %}
